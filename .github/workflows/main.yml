name: Build Android APK Direct

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Generate Keystore in exact paths
      run: |
        # إنشاء ملف debug.keystore في الجذر وفي كل المجلدات المتوقعة
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
        mkdir -p app/
        cp debug.keystore app/debug.keystore || true
        
        if [ -d "android" ]; then
          cp debug.keystore android/debug.keystore || true
          cp debug.keystore android/app/debug.keystore || true
        fi

    - name: Build APK
      run: |
        if [ -f "package.json" ]; then
          npm install --force
          npx expo prebuild --platform android || true
        fi

        if [ -d "android" ]; then
          cd android
        fi

        if [ ! -f "./gradlew" ]; then
          gradle wrapper
        fi

        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          **/build/outputs/apk/debug/*.apk
          **/*.apk
