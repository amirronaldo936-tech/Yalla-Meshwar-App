name: Build Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: |
        npm install --force

    - name: Generate Production Bundle & Release APK
      run: |
        # 1. تجهيز مجلد الـ Assets وحزم الكود للإنتاج
        mkdir -p android/app/src/main/assets
        npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res/ || true

        # 2. إنشاء ملف التوقيع وتجهيزه
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Release,O=Android,C=US" || true
        cp debug.keystore android/debug.keystore || true
        cp debug.keystore android/app/debug.keystore || true

        # 3. بناء النسخة الحقيقية (Release)
        cd android
        if [ ! -f "./gradlew" ]; then
          gradle wrapper
        fi
        chmod +x gradlew
        ./gradlew assembleRelease --no-daemon || ./gradlew assembleDebug --no-daemon

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: |
          **/build/outputs/apk/release/*.apk
          **/build/outputs/apk/debug/*.apk
