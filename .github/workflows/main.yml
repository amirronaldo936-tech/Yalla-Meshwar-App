name: Build Android APK Direct

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Generate Keystore & Build APK
      run: |
        # 1. إنشاء ملف debug.keystore تلقائياً
        mkdir -p app/
        keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
        
        # 2. تثبيت حزم Node إذا وجدت
        if [ -f "package.json" ]; then
          npm install --force
          npx expo prebuild --platform android || true
        fi

        # 3. التأكد من مجلد الأندرويد والتشغيل
        if [ -d "android" ]; then
          cd android
          mkdir -p app/
          keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
        fi

        if [ ! -f "./gradlew" ]; then
          gradle wrapper
        fi

        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          **/build/outputs/apk/debug/*.apk
          **/*.apk
