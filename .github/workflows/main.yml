name: Build Android APK Final

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Find and Build APK
      run: |
        # 1. البحث عن ملف gradlew أو build.gradle
        GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        
        if [ -n "$GRADLEW_PATH" ]; then
          TARGET_DIR=$(dirname "$GRADLEW_PATH")
          echo "Found gradlew in: $TARGET_DIR"
          cd "$TARGET_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        else
          BUILD_DIR=$(find . -maxdepth 3 -name "build.gradle" -exec dirname {} \; | head -n 1)
          if [ -n "$BUILD_DIR" ]; then
            echo "Found build.gradle in: $BUILD_DIR"
            cd "$BUILD_DIR"
            gradle wrapper
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            echo "No Android Gradle project found!"
            exit 1
          fi
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/*.apk"
