name: Build Android APK Direct

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build Everything
      run: |
        # 1. تثبيت حزم Node إذا وجدت
        if [ -f "package.json" ]; then
          npm install --force
          npx expo prebuild --platform android || true
        fi

        # 2. إنشاء مشروع أندرويد مؤقت لو لم يكن هناك أي ملفات أندرويد
        if [ ! -f "build.gradle" ] && [ ! -f "android/build.gradle" ]; then
          echo "No Android folder found, generating android files..."
          npx react-native eject || true
        fi

        # 3. تشغيل البناء بغض النظر عن وجود gradlew
        if [ -d "android" ]; then
          cd android
        fi

        if [ ! -f "./gradlew" ]; then
          gradle wrapper
        fi

        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          **/build/outputs/apk/debug/*.apk
          **/*.apk
