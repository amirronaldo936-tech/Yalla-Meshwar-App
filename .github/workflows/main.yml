name: Build Android APK Final

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Auto-Detect and Build APK
      run: |
        echo "=== Checking Project Structure ==="
        
        # 1. إذا كان المشروع يحتوي على package.json (React Native / Expo)
        if [ -f "package.json" ]; then
          echo "Node/React Native project detected."
          npm install --legacy-peer-deps
          npx expo prebuild --platform android || true
        fi

        # 2. البحث عن ملف gradlew أو إنشاؤه في المجلد الصحيح
        BUILD_DIR=$(find . -maxdepth 3 -name "build.gradle" -exec dirname {} \; | head -n 1)
        if [ -z "$BUILD_DIR" ]; then
          echo "Error: No Android/Gradle project found in repository!"
          exit 1
        fi

        cd "$BUILD_DIR"
        echo "Building in: $(pwd)"

        if [ ! -f "./gradlew" ]; then
          echo "Generating Gradle Wrapper..."
          gradle wrapper
        fi

        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/*.apk"
